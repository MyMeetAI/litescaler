apiVersion: v1
kind: ConfigMap
metadata:
  name: lite-scaler-config
data:
  config.yaml: |
    # Live on prod since 2026-08-31.
    #
    # The old blocker at the top of this file is gone. It said worker-prod was
    # an auto_scale group owned by the Yandex cluster-autoscaler, that this
    # scaler only understands fixed_scale, and that converting the group meant
    # recreating it. All true - and Terraform confirmed the hard part: the
    # scaling type and node_taints are replacement attributes, so switching the
    # live group would have destroyed every burst node at once.
    #
    # So the group was not converted. A second one was created next to it
    # (k8s-terraform: yandex_kubernetes_node_group.external_scaled
    # ["worker-prod-burst"]), fixed_scale from birth, and this scaler owns its
    # size. Both groups carry workload=general-prod, so worker pods schedule
    # onto either; the old one is drained and removed once this one carries the
    # load.
    yandex_cloud:
      service_account_key_file: /secrets/sa-key.json
      # k8s-nodes-central1-a-prod-burst. NOT cat8gsfad91brpidohkl - that is the
      # old auto_scale worker-prod, which this scaler must never touch.
      node_group_id: cato54ig3tc5bgct3vvp
      cluster_id: catp68de0kgi9fc22v0c
      master_endpoint: internal

    kubernetes:
      namespace: bot-prod
      label_selectors:
        # Pods of the KEDA ScaledJob `bot-prod-general` - one Job per meeting,
        # plus the warm pool (35 workers 04:00-21:00 MSK on weekdays, 5
        # otherwise; BotsService `idleSchedule`).
        - app=bot-prod-worker

    scaling:
      pending_pod_threshold: 0
      headroom: 0.10
      max_size: 45
      # min_size 1 since 2026-09-12: in quiet hours prod runs on one burst node.
      # The owner chose cost over off-peak latency. One node is 15 worker slots
      # minus bot-prod-main, calendar-prod-app and scheduler-prod-app (~2.6 CPU)
      # that live on this group too - about 13 workers. With the off-peak warm
      # pool of 5, queue spikes beyond ~8 (p99 21 on weeknights over the 14 days
      # to 2026-08-31) wait out a scale-up: ~40s to decide, ~2 min for the node,
      # ~2 more before the device plugin advertises squat.ai/video.
      #
      # bot-prod-main, calendar-prod-app and scheduler-prod-app tolerate
      # dedicated=bots and run on this group. The empty-node check only
      # sees app=bot-prod-worker, so a scale-down can pick a node that carries
      # one of them (Yandex chooses which node goes) - expect a short restart.
      #
      # What min_size does NOT do: grow the group. It is a floor for scale-down
      # only (app/scaling.py: target = max(current_size - empty, min_size));
      # scale-up is driven purely by Pending pods.
      min_size: 1
      scale_down_cooldown_polls: 3
      poll_interval_seconds: 30
      # Live, not a dry run: prod capacity has to actually follow the load.
      dry_run: false
      log_level: INFO
      node_capacity_fallback:           # matches worker-prod-burst: highfreq-v3 32 vCPU / 64 GiB
        cpu: 32
        memory_gib: 64

    metrics:
      enabled: true
      port: 9090
